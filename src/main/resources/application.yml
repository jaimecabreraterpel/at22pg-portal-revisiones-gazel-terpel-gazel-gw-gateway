spring:
  application:
    name: ${SPRING_APPLICATION_NAME:gazel-gw-gateway}

server:
  # SERVER_PORT permite sobrescribir el puerto; por defecto 8090 (8080/8081 ya estan ocupados aqui)
  port: ${SERVER_PORT:8090}
  shutdown: graceful

gazel:
  gateway:
    # El gateway no autentica todavía: solo enruta y propaga cabeceras.
    uris:
      # Puertos locales unicos: identidad 8180, operaciones 8181, facturacion 8182,
      # parametros 8183, analitica 8184. Sin colisiones en una sola maquina.
      identidad: ${MS_IDENTIDAD_URI:http://localhost:8180}
      operaciones: ${MS_OPERACIONES_URI:http://localhost:8181}
      facturacion: ${MS_FACTURACION_URI:http://localhost:8182}
      # ms-parametros usa el 8183 por defecto (su application.yaml declara SERVER_PORT:8183).
      parametros: ${MS_PARAMETROS_URI:http://localhost:8183}
      analitica: ${MS_ANALITICA_URI:http://localhost:8184}
      # cf-soporte es una Cloud Function local (./mvnw function:run) que escucha en el 8080;
      # es un HttpFunction que sirve en raíz, de ahi el stripPrefix de su ruta.
      soporte: ${MS_SOPORTE_URI:http://localhost:8080}
    cors:
      allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
